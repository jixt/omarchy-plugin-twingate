name: Test

on:
  push:
  pull_request:

permissions: {}

jobs:
  qml-tests:
    name: Parsing.js unit tests (qmltestrunner)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # This job intentionally covers only Parsing.js — the pure, CLI-output
      # parsing logic, which imports nothing from the Omarchy shell (qs.*).
      # BarWidget.qml/Panel.qml themselves import qs.Commons/qs.Ui, which
      # only exist on a real Omarchy install (/usr/share/omarchy/shell) —
      # qmllint -I /usr/share/omarchy/shell and `omarchy plugin validate .`
      # stay local-only checks (see tests/scripts/test.sh) until/unless a
      # container image with Omarchy installed is wired in here too.
      - name: Install Qt 6 QML test tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window

      - name: Run tst_parsing.qml
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          qml_test_runner=$(command -v qmltestrunner || echo /usr/lib/qt6/bin/qmltestrunner)
          "$qml_test_runner" -input tests -import "$PWD" -o -,txt
